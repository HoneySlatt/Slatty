[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
slatty-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

# Dependencies (hashing, decompression, image decoding, rendering) are optimised even in debug
# builds, without debug info; slatty's own crates stay quick to rebuild and keep theirs.
[profile.dev.package."*"]
opt-level = 3
debug = false
