# Dependency policy, checked with `cargo deny check` (see CONTRIBUTING.md).

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# The first two come with Iced 0.14 and should go with an Iced update. They read fonts and the
# icons Slatty ships, and the system's fonts, never data from the network.
# The last three come with zbus 5, which talks to the session's D-Bus (the keyring through
# `keyring`, and desktop notifications). They live on inside zbus 6, which `keyring` does not use
# yet; they read only what the session bus sends.
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, text shaping in Iced's SVG rendering" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, font reading in Iced's text and SVG rendering" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, merged into zbus 6; D-Bus names for the keyring and notifications" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, merged into zbus 6; D-Bus messages for the keyring and notifications" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, merged into zbus 6; derives for zvariant" },
  { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, a macro run while building pulp, for the EXR decoding GPUI turns on in image; no code of its own at run time" },
]

[licenses]
version = 2
# Compatible with GPL-3.0-or-later, the licence of the program they are built into.
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD", "Unlicense",
  "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates point at each other by path; none is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI (slatty-gpui), from a pinned revision of Zed, and what Zed takes from git at that revision.
allow-git = [
  "https://github.com/zed-industries/zed",
  "https://github.com/gfx-rs/wgpu",
  "https://github.com/zed-industries/async-process.git",
  "https://github.com/zed-industries/async-task.git",
  "https://github.com/zed-industries/font-kit",
  "https://github.com/zed-industries/khronos-egl",
  "https://github.com/zed-industries/oo7",
  "https://github.com/zed-industries/xim-rs.git",
]
