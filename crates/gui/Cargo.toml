[package]
name = "slatty-gui"
description = "SlattyLauncher, a native GOG launcher for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "slatty-gui"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
iced = { version = "0.14", features = ["advanced", "image-without-codecs", "selector", "svg", "tokio"] }
# Only the formats GOG serves and those a custom image may be in: fewer decoders face downloads.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde.workspace = true
slatty-core.workspace = true
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util = "0.7"
toml = "0.9"
# The desktop's notifications; already built for Iced and the keyring, no crate added.
zbus = "5"
tracing-subscriber.workspace = true
# The graphics backends to start with; already built for Iced, the same version, no crate added.
wgpu = { version = "27", default-features = false }

[dev-dependencies]
iced_test = "0.14"
