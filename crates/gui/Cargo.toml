[package]
name = "slatty-gui"
description = "Slatty, a native Linux launcher for GOG games, Steam games and your own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "slatty-gui"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
# What Iced runs for the state (`run`).
futures = "0.3"
# Iced's defaults but its system theme detection: the theme comes from Slatty's own tokens,
# and the detection waited up to 200 ms for the desktop portal before the window opened, then kept
# a D-Bus connection whose thread woke the program twice a second for good.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland", "advanced", "image-without-codecs", "selector", "svg", "tokio"] }
# The interface's state, free of Iced.
slatty-app.workspace = true
slatty-core.workspace = true
tracing-subscriber.workspace = true
# The graphics backends to start with; already built for Iced, the same version, no crate added.
wgpu = { version = "27", default-features = false }

[dev-dependencies]
iced_test = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util = "0.7"
